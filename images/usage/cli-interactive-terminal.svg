<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Window frame with shadow -->
  <rect x="10" y="10" width="740" height="460" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title bar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 738 10 C 744.63 10 750 15.37 750 22 L 750 48 L 10 48 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="48" x2="750" y2="48" stroke="#1e293b" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="34" cy="29" r="6" fill="#ef4444"/>
  <circle cx="54" cy="29" r="6" fill="#f59e0b"/>
  <circle cx="74" cy="29" r="6" fill="#10b981"/>

  <!-- Window title -->
  <text x="380" y="33" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500">Terminal — php artisan qr:generate</text>

  <!-- Terminal content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
    <!-- Command Prompt -->
    <text x="32" y="80">
      <tspan fill="#38bdf8" font-weight="bold">$</tspan>
      <tspan fill="#f1f5f9" font-weight="600"> php artisan qr:generate</tspan>
    </text>

    <!-- Step 1: Payload -->
    <text x="32" y="112" fill="#38bdf8">┌  What text or URL should be encoded in the QR code?</text>
    <text x="32" y="132" fill="#94a3b8">│  <tspan fill="#f8fafc">https://laravel-qrcode.mintlify.app</tspan></text>
    <text x="32" y="148" fill="#334155">│</text>

    <!-- Step 2: Output path -->
    <text x="32" y="168" fill="#38bdf8">┌  Where should the generated file be saved? (Leave blank to print to console)</text>
    <text x="32" y="188" fill="#94a3b8">│  <tspan fill="#f8fafc">storage/app/qrcodes/docs-badge.svg</tspan></text>
    <text x="32" y="204" fill="#334155">│</text>

    <!-- Step 3: Format selector -->
    <text x="32" y="224" fill="#38bdf8">┌  Which format should be generated?</text>
    <text x="32" y="244" fill="#94a3b8">│  <tspan fill="#10b981" font-weight="bold">● svg</tspan>  <tspan fill="#64748b">(default vector format)</tspan></text>
    <text x="32" y="262" fill="#94a3b8">│  <tspan fill="#64748b">○ png</tspan></text>
    <text x="32" y="280" fill="#94a3b8">│  <tspan fill="#64748b">○ webp</tspan></text>
    <text x="32" y="298" fill="#94a3b8">│  <tspan fill="#64748b">○ eps</tspan></text>
    <text x="32" y="314" fill="#334155">│</text>

    <!-- Step 4: Advanced options -->
    <text x="32" y="334" fill="#38bdf8">┌  Do you want to configure advanced options? (Size, Colors, Margin...)</text>
    <text x="32" y="354" fill="#94a3b8">│  <tspan fill="#f8fafc">Yes</tspan></text>
    <text x="32" y="370" fill="#334155">│</text>

    <!-- Step 5: Success box -->
    <rect x="32" y="388" width="696" height="52" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1"/>
    <text x="48" y="410" fill="#34d399" font-weight="bold">✔ QR Code generated successfully!</text>
    <text x="48" y="428" fill="#a7f3d0" font-size="12">Saved to: <tspan fill="#f1f5f9">storage/app/qrcodes/docs-badge.svg</tspan> (400×400 px, format: svg)</text>
  </g>
</svg>